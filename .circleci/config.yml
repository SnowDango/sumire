version: 2.1

orbs:
  android: circleci/android@2.5.0
  github-app-token: ostk0069/github-app-token@0.0.1

parameters:
  target-branch:
    description: "PR先のbranch"
    type: string
    default: ""
  pr-number:
    description: "PRの番号"
    type: integer
    default: 0

commands:
  setup-siging-debug:
    description: "Debug用のsigingのsetup"
    steps:
      - run:
          name: siging.properties
          command: |
            touch siging.properties
            echo $SIGING_PROPERTIES | base64 -d >> siging.properties
      - run:
          name: debug.jks
          command: |
            touch debug.jks
            echo $DEBUG_JKS | base64 -d >> debug.jks
  setup-siging-release:
    description: "Release用のsigingのsetup"
    steps:
      - run:
          name: siging.properties
          command: |
            touch siging.properties
            echo $SIGING_PROPERTIES | base64 -d >> siging.properties
      - run:
          name: release.jks
          command: |
            touch release.jks
            echo $RELEASE_JKS | base64 -d >> release.jks
  setup-local-properties:
    description: "local.propertiesのsetup(Empty)"
    steps:
      - run:
          name: local.properties
          command:
            touch local.properties
  setup-debug-google-services:
    description: "Debug用のgoogle-services.jsonのsetup"
    steps:
      - run:
          name: google-services.json
          command: |
            touch ./app/src/debug/google-services.json
            echo $DEBUG_SERVICE_JSON | base64 -d >> ./app/src/debug/google-services.json
  setup-release-google-services:
    description: "Release用のgoogle-services.jsonのsetup"
    steps:
      - run:
          name: google-services.json
          command: |
            touch ./app/src/release/google-services.json
            echo $RELEASE_SERVICE_JSON | base64 -d >> ./app/src/release/google-services.json
  restore-gradle:
    description: |
      Gradle の依存キャッシュを復元する。
      orb の restore-gradle-cache は build.gradle* と settings.gradle* しか鍵に含めないため、
      依存バージョンが gradle/libs.versions.toml にあるこのプロジェクトでは鍵が変わらず
      古いキャッシュを復元し続けていた。toml と wrapper も鍵に含め、完全一致が無いときは
      最新の同系キャッシュをフォールバックとして使う。
    steps:
      - run:
          name: generate gradle cache seed
          command: |
            find . -path "*/build" -prune -o \
              \( -name "build.gradle*" -o -name "settings.gradle*" -o -name "*.versions.toml" -o -name "gradle-wrapper.properties" \) -print \
              | sort | xargs cat | shasum | awk '{print $1}' > /tmp/gradle_cache_seed
            cat /tmp/gradle_cache_seed
      - restore_cache:
          name: restore gradle cache
          keys:
            - gradle-v2-{{ arch }}-{{ checksum "/tmp/gradle_cache_seed" }}
            - gradle-v2-{{ arch }}-
  save-gradle:
    description: |
      Gradle の依存キャッシュを保存する。
      Compose Preview Screenshot Testing が使う layoutlib も Gradle の依存として
      ~/.gradle/caches に落ちる。
      CircleCI のキャッシュは同じ鍵では上書きされないため、テストまで実行して依存が
      揃っているジョブ(unittest / VRT 系)からだけ保存する。
    steps:
      - save_cache:
          name: save gradle cache
          key: gradle-v2-{{ arch }}-{{ checksum "/tmp/gradle_cache_seed" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper

jobs:
  lint:
    executor:
      name: android/android-machine
      resource-class: large
      tag: default
    steps:
      - checkout
      - restore-gradle
      - run:
          name: chmod gradlew
          command: |
            chmod +x gradlew
      - setup-local-properties
      - setup-siging-debug
      - setup-debug-google-services
      - run:
          name: detekt
          command: |
            ./gradlew detekt --auto-correct
  release-build:
    executor:
      name: android/android-machine
      resource-class: large
      tag: default
    steps:
      - checkout
      - restore-gradle
      - run:
          name: chmod gradlew
          command: |
            chmod +x gradlew
      - setup-local-properties
      - setup-siging-release
      - setup-release-google-services
      - run:
          name: build
          command: |
            ./gradlew assembleRelease
  build:
    executor:
      name: android/android-machine
      resource-class: large
      tag: default
    steps:
      - checkout
      - restore-gradle
      - run:
          name: chmod gradlew
          command: |
            chmod +x gradlew
      - setup-local-properties
      - setup-siging-debug
      - setup-debug-google-services
      - run:
          name: build
          command: |
            ./gradlew assembleDebug --stacktrace
          no_output_timeout: 20m
      # ビルド成果物を unittest ジョブへ持ち越す。
      # - project/.gradle と各モジュールの build: Gradle の up-to-date 判定に使われ、
      #   同じ入力ならコンパイル済みの出力をそのまま再利用できる
      # - ~/.gradle/caches/build-cache-1: Gradle build cache。up-to-date 判定が
      #   外れたタスクもここから出力を復元できる(org.gradle.caching=true が前提)
      - persist_to_workspace:
          root: ~/
          paths:
            - .gradle/caches/build-cache-1
            - project/.gradle
            - project/app/build
            - project/ui/build
            - project/infla/build
            - project/data/build
            - project/model/build
            - project/repository/build
            - project/usecase/build
            - project/presenter/playing/build
            - project/presenter/history/build
            - project/presenter/settings/build
            - project/presenter/report/build
            - project/presenter/widget/build
  unittest:
    executor:
      name: android/android-machine
      resource-class: large
      tag: default
    steps:
      - checkout
      - restore-gradle
      # build ジョブの成果物を同じパスに展開する(restore-gradle の後に置くこと)
      - attach_workspace:
          at: ~/
      - run:
          name: chmod gradlew
          command: |
            chmod +x gradlew
      - setup-local-properties
      - setup-siging-debug
      - setup-debug-google-services
      - run:
          name: UnitTest
          command: |
            ./gradlew testDebugUnitTest
      - save-gradle
  save-screenshot:
    executor:
      name: android/android-machine
      resource-class: large
      tag: default
    steps:
      - checkout
      - restore-gradle
      - run:
          name: chmod gradlew
          command: |
            chmod +x gradlew
      - setup-local-properties
      - setup-siging-debug
      - setup-debug-google-services
      - run:
          name: take screenshot
          command: |
            ./gradlew updateDebugScreenshotTest --stacktrace
          no_output_timeout: 20m
      - save-gradle
      - run:
          name: collect screenshots
          command: |
            chmod +x .circleci/collect-screenshots.sh
            .circleci/collect-screenshots.sh screenshots
      # fetch-base-screenshots.sh は path が screenshots/ で始まる artifact だけを比較元に使う
      - store_artifacts:
          path: screenshots
          destination: screenshots
  screen-shot:
    parameters:
      target-branch:
        type: string
        default: ""
    executor:
      name: android/android-machine
      resource-class: large
      tag: default
    steps:
      - checkout
      # 比較元(target branch)の画像は、develop/master への push 時に save-screenshot ジョブが
      # 撮って artifact に保存している。target branch の HEAD と同じコミットの artifact が
      # あればそれを再利用し、フルビルドと撮影を省く。無いときだけ撮影する。
      # target branch がまだ Compose Preview Screenshot Testing を入れていない(移行前の)ときは
      # 撮りようが無いので比較元を空にし、PR 側の画像をすべて追加扱いで比較する。
      - run:
          name: reuse base branch screenshots if available
          command: |
            TARGET="<<parameters.target-branch>>"
            OUT=vrt-base
            mkdir -p "$OUT"
            chmod +x .circleci/fetch-base-screenshots.sh
            if .circleci/fetch-base-screenshots.sh "$TARGET" "$OUT"; then
              echo "source=reused" > "$OUT/.base_screenshots"
            else
              find "$OUT" -mindepth 1 -delete
              git fetch -q origin "$TARGET" || true
              if ! base_toml=$(git show "origin/$TARGET:gradle/libs.versions.toml"); then
                echo "cannot read gradle/libs.versions.toml of $TARGET, fall back to recording"
                echo "source=record" > "$OUT/.base_screenshots"
              elif [[ "$base_toml" == *com.android.compose.screenshot* ]]; then
                echo "base screenshots are not available, fall back to recording"
                echo "source=record" > "$OUT/.base_screenshots"
              else
                echo "$TARGET does not use Compose Preview Screenshot Testing yet, compare with an empty base"
                echo "source=none" > "$OUT/.base_screenshots"
              fi
            fi
      - persist_to_workspace:
          root: ./
          paths:
            - vrt-base
      - run:
          name: halt when recording is not needed
          command: |
            cat vrt-base/.base_screenshots
            if ! grep -q '^source=record$' vrt-base/.base_screenshots; then
              echo "skip recording"
              circleci-agent step halt
            fi
      # 撮影後に画像を集めるスクリプトは、target branch 側ではなくこの config と同じ版を使う
      - run:
          name: checkout target branch
          command: |
            cp .circleci/collect-screenshots.sh /tmp/collect-screenshots.sh
            chmod +x /tmp/collect-screenshots.sh
            git checkout <<parameters.target-branch>>
      - restore-gradle
      - run:
          name: chmod gradlew
          command: |
            chmod +x gradlew
      - setup-local-properties
      - setup-siging-debug
      - setup-debug-google-services
      - run:
          name: take screenshot
          command: |
            ./gradlew updateDebugScreenshotTest --stacktrace
          no_output_timeout: 20m
      - save-gradle
      # .base_screenshots は最初の persist_to_workspace で既に workspace に入っている。
      # 同じファイルを 2 つの層に入れないよう、撮影した画像だけを持ち越す
      - run:
          name: collect screenshots
          command: |
            rm -f vrt-base/.base_screenshots
            /tmp/collect-screenshots.sh vrt-base
      - persist_to_workspace:
          root: ./
          paths:
            - vrt-base
  vrt:
    parameters:
      target-branch:
        type: string
        default: ""
    executor:
      name: android/android-machine
      resource-class: large
      tag: default
    steps:
      - checkout
      # screen-shot ジョブが用意した比較元(vrt-base)を受け取る
      - attach_workspace:
          at: ./
      - restore-gradle
      - run:
          name: chmod gradlew
          command: |
            chmod +x gradlew
      - setup-local-properties
      - setup-siging-debug
      - setup-debug-google-services
      - run:
          name: take screenshot
          command: |
            ./gradlew updateDebugScreenshotTest --stacktrace
          no_output_timeout: 20m
      - save-gradle
      - run:
          name: collect screenshots
          command: |
            chmod +x .circleci/collect-screenshots.sh
            .circleci/collect-screenshots.sh vrt-head
      # 比較元と PR 側を突き合わせ、差分・追加・削除があった画面だけ
      # vrt-result/images/*_compare.png(左から base / diff / PR)と vrt-result/summary.tsv を作る
      - run:
          name: compare screenshot
          command: |
            cat vrt-base/.base_screenshots || true
            # gradlew と同じく JAVA_HOME を優先する(source-file mode なので JDK 11 以上が要る)
            JAVA="${JAVA_HOME:+$JAVA_HOME/bin/}java"
            "$JAVA" -version
            "$JAVA" .circleci/CompareScreenshots.java vrt-base vrt-head vrt-result
      - store_artifacts:
          path: vrt-result/images
      # result-comment ジョブに渡す結果一式。比較画像(PR コメントに直接添付する)と、
      # 添付できないときのリンク用に CircleCI artifact の一覧を入れる
      - run:
          name: collect vrt result
          command: |
            ls -la vrt-result/images
            curl -H "Circle-Token: $CIRCLE_TOKEN" "https://circleci.com/api/v2/project/github/SnowDango/sumire/$CIRCLE_BUILD_NUM/artifacts" --output vrt-result/artifact.json
            cat vrt-result/artifact.json
      - persist_to_workspace:
          root: ./
          paths:
            - vrt-result
  result-comment:
    # gh と curl を動かすだけなので android machine は不要。小さい docker で起動を速くする
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - checkout
      # 画像を直接アップロードする --attach は gh 2.99.0 で入ったので、バージョンを固定して入れる
      - run:
          name: install gh cli
          environment:
            GH_CLI_VERSION: "2.99.0"
          command: |
            curl -sSL "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz" -o /tmp/gh.tgz
            sudo tar -xzf /tmp/gh.tgz -C /usr/local --strip-components=1
            gh --version
      - attach_workspace:
          at: ./
      - github-app-token/fetch-token:
          app_id: $GITHUB_APPS_ID
          base64_private_key: $GITHUB_APPS_PRIVATE_KEY
          installation_id: 54651436
      # VRT_COMMENT_TOKEN(ユーザーの PAT)があれば比較画像をコメントに直接埋め込み、
      # 無ければ GitHub App のトークンで従来どおり artifact へのリンク表を貼る
      - run:
          name: pull request comment
          command: |
            chmod +x .circleci/post-vrt-comment.sh
            .circleci/post-vrt-comment.sh vrt-result
workflows:
  # GitHub Actions から API 経由で起動される VRT 用パイプライン(target-branch 付き)では
  # VRT 以外のワークフローを動かさない。従来は build-test がここでも走り、
  # push 起動側のパイプラインと二重に実行されていた。
  save-screenshot:
    when:
      equal: [ "", << pipeline.parameters.target-branch >> ]
    jobs:
      - save-screenshot:
          filters:
            branches:
              only:
                - "develop"
                - "master"
  release-build-test:
    when:
      equal: [ "", << pipeline.parameters.target-branch >> ]
    jobs:
      - release-build:
          filters:
            branches:
              only:
                - "develop"
  build-test:
    when:
      equal: [ "", << pipeline.parameters.target-branch >> ]
    jobs:
      # lint と build は依存関係が無いので並列に走らせる
      - lint:
          filters:
            branches:
              ignore:
                - "master"
      - build:
          filters:
            branches:
              ignore:
                - "master"
      - unittest:
          requires:
            - build
  vrt-test:
    when:
      not:
        equal: [ "", << pipeline.parameters.target-branch >> ]
    jobs:
      - screen-shot:
          target-branch: << pipeline.parameters.target-branch >>
      - vrt:
          target-branch: << pipeline.parameters.target-branch >>
          requires:
            - screen-shot
      - result-comment:
          requires:
            - vrt
